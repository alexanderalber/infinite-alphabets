<!-- Rueckfall fuer Schaltflaechen ohne data-icon: ein neutraler Punkt, damit die
     Hausregel "jeder Knopf beginnt mit einem Icon" auch dann gilt, wenn jemand
     einen Knopf ergaenzt und die Zuordnung vergisst. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="12" r="3.5" />
</svg>
