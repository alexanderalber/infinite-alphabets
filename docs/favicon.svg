<!-- Favicon: schlichtes Unendlichzeichen, weiss auf transparent.
     Ein durchgehender Zug, zwei spiegelbildliche Schlaufen, die sich in der
     Mitte kreuzen. Kein Hintergrund, damit das Icon sich in helle wie dunkle
     Browserleisten einfuegt. Kein Font, damit nichts von der Zielmaschine
     abhaengt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M16 16
           C 13.6 11.4, 10.4 10.4, 8.2 11.8
           C 5.6 13.4, 5.6 18.6, 8.2 20.2
           C 10.4 21.6, 13.6 20.6, 16 16
           C 18.4 11.4, 21.6 10.4, 23.8 11.8
           C 26.4 13.4, 26.4 18.6, 23.8 20.2
           C 21.6 21.6, 18.4 20.6, 16 16 Z"
        fill="none" stroke="#ffffff" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
